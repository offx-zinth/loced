# LoCED-500M 2x T4 (FSDP=2) HF streaming training config.
#
#   python -m loced.maxtext.hf_train \
#       loced/maxtext/configs/loced_500m_t4x2.yml \
#       steps=25000000 run_name=loced-500m-t4x2-hf
#
# The step cap is deliberately above one full mixed pass (~4-5B tokens at
# batch 2 x 128).  hf_train.py stops when the six streaming datasets are
# exhausted, so this is a full-pass run, not an arbitrary 25M-step run.  Keep
# the 10-minute time-based checkpoints: a full pass takes many Kaggle sessions
# on 2x T4.
base_config: base.yml
model_name: loced-500m

run_name: loced-500m-t4x2-hf
log_config: false

# Kaggle is a single host.  Without this MaxText tries to initialize JAX's
# multi-host distributed runtime and fails on an empty JAX_COORDINATOR_IP.
skip_jax_distributed_system: true

# --- data / optimization (MaxText owns these) ---
steps: 25000000
learning_rate: 1.0e-4
learning_rate_schedule_steps: 20000000
warmup_steps_fraction: 0.02
learning_rate_final_fraction: 1.0
lr_schedule_type: cosine
per_device_batch_size: 2
max_target_length: 128
enable_dropout: false

# MaxText Muon only.
opt_type: muon
muon_type: maxtext_muon
muon_include_routers: true
muon_use_all_to_all: false
muon_weight_decay: 0.0
adam_weight_decay: 0.01

# 2x T4, FSDP=2.  Parameters and optimizer state are sharded across both GPUs.
ici_data_parallelism: 1
ici_fsdp_parallelism: 2
ici_tensor_parallelism: 1
ici_expert_parallelism: 1

# hf_train.py does the 10-minute wall-clock checkpointing; this is the fallback.
enable_checkpointing: true
checkpoint_period: 10
checkpoint_dir: ""
