# LoCED-tiny model shape for parity tests and CPU smoke runs.
#
# MaxText fields define the parts MaxText understands (width, depth, vocab,
# MoE, dtypes); loced_* fields are the architecture-specific additions
# declared by loced.maxtext.config.LoCEDMaxTextConfig.

# --- standard MaxText model shape ---
base_emb_dim: 64
base_num_query_heads: 4
base_num_kv_heads: 1          # LoCED is MQA: one shared KV head
head_dim: 16
base_num_decoder_layers: 4    # == len(loced_encode_layers)
base_mlp_dim: 128
base_moe_mlp_dim: 128
mlp_activations: ["silu", "linear"]
vocab_size: 64
max_target_length: 64
normalization_layer_epsilon: 1.0e-6
enable_dropout: false
logits_via_embedding: false
decoder_block: llama2         # unused by LoCEDModel; keeps MaxText validation happy

# --- MoE (MaxText fields) ---
num_experts: 4
num_experts_per_tok: 2
shared_experts: 1

# --- LoCED-specific architecture ---
loced_pool_m: 2
loced_window: 16
loced_top_k: 16
loced_indexer_heads: 2
loced_indexer_dim: 32
loced_indexer_block: 4
loced_hier_blocks: 4
loced_indexer_mlp: 0
loced_intermediate_size: 128
loced_max_decode_len: 32
loced_encode_layers: ["full", "full", "full", "full"]
loced_decode_layers: ["full", "full", "full", "full", "reuse", "reuse", "reindex", "reindex"]

# --- LoCED auxiliary losses ---
loced_aux_deep_weight: 0.10
loced_indexer_kl_coef: 0.50
loced_moe_aux_weight: 0.01
loced_rms_norm_eps: 1.0e-6
loced_init_std: 0.02

# CPU smoke runs keep full precision; a TPU run overrides these with
# dtype=bfloat16 weight_dtype=float32.
dtype: float32
weight_dtype: float32
