# LoCED-500M model shape for a single TPU v5e-1 smoke run.
#
# 4 physical layers, 8 visits, ~500.2M parameters.  The width/MLP/vocab and
# expert dimensions are scaled up from loced-tiny; the architecture and the
# explicit encode/decode schedule are unchanged.

# --- standard MaxText model shape ---
base_emb_dim: 1024
base_num_query_heads: 8
base_num_kv_heads: 1          # LoCED is MQA: one shared KV head
head_dim: 128
base_num_decoder_layers: 4    # == len(loced_encode_layers)
base_mlp_dim: 3840
base_moe_mlp_dim: 3840
mlp_activations: ["silu", "linear"]
vocab_size: 32000
max_target_length: 64
normalization_layer_epsilon: 1.0e-6
enable_dropout: false
logits_via_embedding: false
decoder_block: llama2         # unused by LoCEDModel; keeps MaxText validation happy

# --- MoE (MaxText fields) ---
num_experts: 8
num_experts_per_tok: 2
shared_experts: 1

# --- LoCED-specific architecture ---
loced_pool_m: 2
loced_window: 32
loced_top_k: 32
loced_indexer_heads: 4
loced_indexer_dim: 64
loced_indexer_block: 4
loced_hier_blocks: 4
loced_indexer_mlp: 0
loced_intermediate_size: 3840
loced_max_decode_len: 32
loced_encode_layers: ["full", "full", "full", "full"]
loced_decode_layers: ["full", "full", "full", "full", "reuse", "reuse", "reindex", "reindex"]

# --- LoCED auxiliary losses ---
loced_aux_deep_weight: 0.10
loced_indexer_kl_coef: 0.50
loced_moe_aux_weight: 0.01
loced_rms_norm_eps: 1.0e-6
loced_init_std: 0.02

# The reference core currently computes in float32; keep master weights in
# float32 so the 500M smoke is numerically identical to the tiny parity path.
dtype: float32
weight_dtype: float32
